# version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intel_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  pipeline:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    command: ["python", "-m", "pipeline.graph"]

  scheduler:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: ["celery", "-A", "pipeline.scheduler.celery_app", "beat", "--loglevel=info"]

  worker:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: ["celery", "-A", "pipeline.scheduler.celery_app", "worker", "--loglevel=info"]

  dashboard:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - qdrant
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0"]

volumes:
  pgdata:
  qdrantdata:
